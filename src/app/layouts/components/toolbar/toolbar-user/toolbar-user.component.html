<div
  #originRef
  (click)="showPopover(originRef)"
  [class.bg-hover]="dropdownOpen"
  class="flex items-center rounded cursor-pointer relative transition duration-400 ease-out-swift select-none py-0 pr-1 pl-2 hover:bg-hover"
  matRipple>
  <div
    class="body-1 font-medium leading-snug ltr:mr-2 rtl:ml-2 hidden sm:block text-sm">
    {{ nombreUsuario }}
  </div>
  <div
    class="rounded-full h-7 w-7 flex items-center justify-center text-primary-600 bg-primary-600/10">
    <mat-icon svgIcon="mat:person" class="icon-sm"></mat-icon>
  </div>
</div>
