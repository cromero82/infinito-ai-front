<div class="footer-inner">
  @if (footerItems.length) {
    <div class="footer-items-horizontal">
      @for (item of footerItems; track trackByTextoClave($index, item)) {
        <span class="footer-item" [ngClass]="item.estiloCssClave">
          <span class="footer-item-key">{{ item.textoClave }}</span>
          <span class="footer-item-separator">:</span>
          <span class="footer-item-value">{{ item.valorClave }}</span>
        </span>
      }
    </div>
  }
</div>
