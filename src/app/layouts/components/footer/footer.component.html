<div class="footer-inner">
  <div
    *ngIf="footerItems?.length"
    class="footer-items-horizontal">
    <span
      *ngFor="let item of footerItems; trackBy: trackByTextoClave"
      class="footer-item"
      [ngClass]="item.estiloCssClave">
      <span class="footer-item-key">{{ item.textoClave }}</span>
      <span class="footer-item-separator">:</span>
      <span class="footer-item-value">{{ item.valorClave }}</span>
    </span>
  </div>
</div>
