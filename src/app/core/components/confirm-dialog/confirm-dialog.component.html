<div mat-dialog-title class="flex items-center justify-between">
  <div>{{ data.titulo || 'Confirmación' }}</div>
  <button
    type="button"
    mat-icon-button
    (click)="onNoClick()"
    tabindex="-1">
    <mat-icon svgIcon="mat:close"></mat-icon>
  </button>
</div>

<mat-dialog-content>
  <p>{{ data.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">No</button>
  <button mat-button color="primary" (click)="onYesClick()">Sí</button>
</mat-dialog-actions>
