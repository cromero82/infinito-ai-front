<form (ngSubmit)="save()" [formGroup]="form" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <div class="flex items-center dialog-header" mat-dialog-title cdkDragHandle>
    <h2 class="headline m-0 flex-auto">
      {{ form.controls['nombre'].value || (data ? 'Editar producto' : 'Nuevo producto') }}
    </h2>
    <button class="text-secondary" mat-dialog-close mat-icon-button type="button">
      <mat-icon svgIcon="mat:close"></mat-icon>
    </button>
  </div>
  <mat-divider class="text-border"></mat-divider>
  <mat-dialog-content class="flex flex-col">
    <mat-form-field class="mt-6 flex-1">
      <mat-label>Código de barras</mat-label>
      <input #barcodeInput formControlName="barcode" matInput (focus)="onBarcodeFocus()" />
      <mat-icon matIconPrefix svgIcon="mat:qr_code"></mat-icon>
    </mat-form-field>
    <mat-form-field class="flex-1">
      <mat-label>Nombre</mat-label>
      <input #nombreInput formControlName="nombre" matInput />
      <mat-icon matIconPrefix svgIcon="mat:label"></mat-icon>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Precio (Venta)</mat-label>
      <input #precioInput formControlName="precio" matInput type="number" (focus)="onPrecioFocus()" />
      <mat-icon matIconPrefix svgIcon="mat:attach_money"></mat-icon>
    </mat-form-field>
    <div class="precio-compra-row">
      <mat-form-field class="precio-compra-field">
        <mat-label>Precio de compra</mat-label>
        <input #buyPriceInput formControlName="buy_price" matInput type="number" (focus)="onBuyPriceFocus()" />
        <mat-icon matIconPrefix svgIcon="mat:shopping_cart"></mat-icon>
      </mat-form-field>
      <mat-form-field class="ganancia-porcentaje-field">
        <mat-label>% Ganancia</mat-label>
        <input matInput [value]="getGananciaPorcentajeDisplay() ?? '—'" readonly />
      </mat-form-field>
    </div>
    <div class="flex items-center mt-4 gap-4 flex-wrap">
      <mat-slide-toggle 
        [checked]="isActivateChecked"
        (change)="onActivateChange($event)">
        {{ isActivateChecked ? 'Producto activo' : 'Producto inactivo' }}
      </mat-slide-toggle>
    </div>
    <div class="ganancia-alert" *ngIf="showGananciaInferiorAlert()">
      <span class="ganancia-alert-label">Producto con ganancia inferior al {{ porcentajeMinimoGanancia }} %</span>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button [color]="isEditMode ? 'accent' : 'primary'" mat-flat-button type="submit" [disabled]="form.invalid">
      {{ buttonLabel }}
    </button>
  </mat-dialog-actions>
</form>
