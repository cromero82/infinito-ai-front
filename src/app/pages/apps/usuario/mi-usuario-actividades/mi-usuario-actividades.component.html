<div class="mt-6 flex flex-col md:flex-row md:items-start">
  <div class="flex-auto">
    <div class="card">
      <div class="px-6 py-4 border-b">
        <h2 class="title m-0">Actividad</h2>
      </div>

      <div class="px-6 py-4">
        <div *ngIf="loading" class="text-center py-4">
          Cargando actividad...
        </div>
        
        <table mat-table [dataSource]="sesiones" class="w-full" *ngIf="!loading">
          <ng-container matColumnDef="tipoActividad">
            <th mat-header-cell *matHeaderCellDef>Tipo de actividad</th>
            <td mat-cell *matCellDef="let sesion">Inicio de sesión</td>
          </ng-container>

          <ng-container matColumnDef="fechaInicio">
            <th mat-header-cell *matHeaderCellDef>Fecha inicio</th>
            <td mat-cell *matCellDef="let sesion">{{ formatDate(sesion.fechaInicio) }}</td>
          </ng-container>

          <ng-container matColumnDef="fechaFin">
            <th mat-header-cell *matHeaderCellDef>Fecha fin</th>
            <td mat-cell *matCellDef="let sesion">{{ formatDate(sesion.fechaFin) }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <div *ngIf="!loading && sesiones.length === 0" class="text-center py-4 text-secondary">
          No hay actividad registrada
        </div>
      </div>
    </div>
  </div>
</div>
