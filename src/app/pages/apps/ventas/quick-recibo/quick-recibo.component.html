<h2 mat-dialog-title>Recibo Rápido</h2>

<div mat-dialog-content class="dialog-content">
  <div class="form-fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cliente</mat-label>
      <mat-select [formControl]="clienteCtrl" [disabled]="loadingClientes || loading">
        <mat-option *ngFor="let cliente of clientes" [value]="cliente.id">
          {{ cliente.nombre }}
        </mat-option>
      </mat-select>
      <mat-progress-spinner *ngIf="loadingClientes" matSuffix diameter="20" mode="indeterminate"></mat-progress-spinner>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Total</mat-label>
      <input
        #totalInput
        matInput
        [formControl]="totalCtrl"
        (keydown.enter)="onTotalKeydown($event)"
        (input)="onTotalInput($event)"
        (blur)="onTotalBlur()"
        placeholder="Ej. 100000"
        type="text"
        [disabled]="loading" />
    </mat-form-field>
  </div>

  <div class="error-message" *ngIf="error">
    {{ error }}
  </div>

  <div class="metodos-pago-section">
    <div class="metodos-pago" *ngIf="!loadingMetodos && metodosPago.length > 0">
      <ng-container *ngFor="let metodo of metodosPago">
        <button
          *ngIf="metodo.estado !== 'inactivo'"
          type="button"
          class="metodo-pago-btn"
          mat-icon-button
          [matTooltip]="metodo.descripcion"
          (click)="seleccionarMetodoPago(metodo)"
          [disabled]="loading"
          [class.metodo-pago-seleccionado]="selectedMetodoPagoId === metodo.id">
          <img
            [src]="'assets/img/icons/payments/' + metodo.file"
            [alt]="metodo.descripcion"
            class="metodo-pago-icon" />
          <mat-icon
            *ngIf="metodo.estado !== 'activo'"
            class="metodo-pago-warning"
            svgIcon="mat:warning">
          </mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()" [disabled]="loading">Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    (click)="pagar()"
    [disabled]="!canPagar()">
    Pagar
  </button>
</div>
