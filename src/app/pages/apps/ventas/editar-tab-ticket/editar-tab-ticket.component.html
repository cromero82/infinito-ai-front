<h2 mat-dialog-title>Editar Ticket — {{ data.ticket.nombre }}</h2>

<div mat-dialog-content class="dialog-content">
  <div class="form-fields">
    <cliente-selector
      [initialClienteId]="data.ticket.cliente?.id ?? null"
      [disabled]="loading"
      [autoFocus]="true"
      (clienteSelected)="onClienteSelectedFromSelector($event)">
    </cliente-selector>
  </div>

  @if (error) {
    <div class="error-message">
      {{ error }}
    </div>
  }
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()" [disabled]="loading">Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    (click)="guardar()"
    [disabled]="!canGuardar()">
    @if (loading) {
      <mat-progress-spinner
        diameter="18"
        mode="indeterminate"
        class="inline-spinner"></mat-progress-spinner>
    }
    @if (!loading) {
      <span>Guardar</span>
    }
  </button>
</div>
