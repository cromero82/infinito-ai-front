<div class="selector-productos-dialog-shell" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <div class="selector-productos-dialog-header" mat-dialog-title cdkDragHandle>
    <h2 class="selector-productos-dialog-title">Seleccionar Producto</h2>
  </div>

<div mat-dialog-content class="dialog-content">
  <div class="search-field-wrapper">
    <mat-form-field appearance="outline" class="search-input">
      <mat-label>Nombre o código de barras</mat-label>
      <input
        #searchInput
        matInput
        id="searchInput"
        [formControl]="searchCtrl"
        placeholder="Ej. código de barras o nombre"
        autocomplete="off" />
      <div matSuffix class="search-suffix-actions">
        <button
          mat-icon-button
          *ngIf="searchCtrl.value"
          aria-label="Limpiar búsqueda"
          type="button"
          (click)="clearSearch()">
          <mat-icon class="icon-sm" svgIcon="mat:close"></mat-icon>
        </button>
        <button
          mat-icon-button
          *ngIf="canCreateProduct"
          color="primary"
          aria-label="Registrar producto"
          matTooltip="Nuevo producto"
          type="button"
          (click)="openNuevoProducto($event)">
          <mat-icon svgIcon="mat:add"></mat-icon>
        </button>
      </div>
    </mat-form-field>
  </div>

  <div class="table-container" (scroll)="onTableScroll($event)">
    <div class="loading" *ngIf="loading">Cargando productos...</div>
    <div class="error" *ngIf="!loading && error">{{ error }}</div>

    <table mat-table [dataSource]="products" class="product-table" *ngIf="!loading && products.length">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Producto</th>
      <td mat-cell *matCellDef="let product">{{ product.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="barcode">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let product">{{ product.barcode }}</td>
    </ng-container>

    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef class="col-precio">Precio</th>
      <td mat-cell *matCellDef="let product" class="col-precio">
        <ng-container *ngIf="tienePrecioDual(product); else precioSimpleTpl">
          <div class="precio-dual-wrap">
            <div class="precio-dual-lines">
              <button
                type="button"
                class="precio-dual-line"
                [class.precio-dual-line--picked]="
                  modoPrecioExplicitoPorProducto[product.id!] && getModoPrecioParaSeleccion(product) === 'precio'
                "
                (click)="seleccionarModoPrecio(product, 'precio', $event)">
                <span
                  class="precio-dual-label"
                  matTooltip="Precio por empaque o presentación completa (no por unidad suelta)"
                  matTooltipShowDelay="400">
                  General
                </span>
                <span class="precio-dual-value">{{ product.precio | currency:'USD':'symbol':'1.2-2' }}</span>
              </button>
              <button
                type="button"
                class="precio-dual-line"
                [class.precio-dual-line--picked]="
                  modoPrecioExplicitoPorProducto[product.id!] && getModoPrecioParaSeleccion(product) === 'precioUnidad'
                "
                (click)="seleccionarModoPrecio(product, 'precioUnidad', $event)">
                <span
                  class="precio-dual-label"
                  matTooltip="Precio por unidad individual del producto"
                  matTooltipShowDelay="400">
                  Unidad
                </span>
                <span class="precio-dual-value">{{ product.precioUnidad | currency:'USD':'symbol':'1.2-2' }}</span>
              </button>
            </div>
          </div>
        </ng-container>
        <ng-template #precioSimpleTpl>
          <div class="precio-cell">
            <span class="precio-principal">{{ product.precio | currency:'USD':'symbol':'1.2-2' }}</span>
          </div>
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let product">
        <div class="action-buttons">
          <button
            mat-icon-button
            color="primary"
            (click)="editProduct(product, $event)"
            matTooltip="Editar producto"
            type="button">
            <mat-icon svgIcon="mat:edit"></mat-icon>
          </button>
          <button mat-flat-button color="primary" (click)="selectProduct(product)">
            Seleccionar
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  </div>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="close()">Cerrar</button>
</div>

</div>
