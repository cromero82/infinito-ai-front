<div
  class="container pt-2 pb-1 logs-errores-page flex flex-col flex-1 min-h-0 min-w-0">
  <div class="card overflow-hidden flex-shrink-0">
    <div class="h-10 relative overflow-hidden">
      <img
        class="w-full h-full object-cover"
        src="assets/img/demo/revenew-concept.jpeg" />
      <div
        class="absolute bg-black opacity-25 top-0 right-0 bottom-0 left-0 w-full h-full z-0"></div>

      <img
        class="avatar h-16 w-16 absolute top-3 ltr:left-4 rtl:right-4 sm:hidden"
        src="assets/img/avatars/1.jpg" />
    </div>

    <div class="z-10 relative -mt-10 px-6 flex items-center">
      <img
        @scaleIn
        class="avatar h-16 w-16 flex-none align-start hidden sm:block border-2 border-white"
        src="assets/img/icons/custom/payment-icon.png" />

      <div class="max-w-full flex-auto sm:ltr:ml-6 sm:rtl:mr-6">
        <div class="h-10 flex items-end">
          <h1 @fadeInRight class="headline text-white pb-2 m-0">
            {{ tituloSeccion }}
          </h1>
        </div>

        <nav [tabPanel]="tabPanel" class="border-0" mat-tab-nav-bar>
          @for (link of links; track link.route) {
            <a
              #rla="routerLinkActive"
              [active]="rla.isActive"
              [disabled]="link.disabled ?? false"
              [routerLinkActiveOptions]="
                link.routerLinkActiveOptions || { exact: false }
              "
              [routerLink]="link.route"
              mat-tab-link
              queryParamsHandling="preserve"
              routerLinkActive>
              {{ link.label }}
            </a>
          }
        </nav>
        <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
      </div>
    </div>
  </div>

  <div class="logs-errores-outlet flex flex-col flex-1 min-h-0 min-w-0">
    <router-outlet></router-outlet>
  </div>
</div>
