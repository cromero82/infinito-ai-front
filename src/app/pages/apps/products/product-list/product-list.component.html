<vex-page-layout>
  <vex-page-layout-header class="pb-4 flex flex-col items-start justify-center">
    <div [class.container]="true" class="w-full flex flex-col sm:flex-row justify-between">
    </div>
  </vex-page-layout-header>

  <vex-page-layout-content [class.container]="true" class="-mt-6 pb-0">
    <div class="card products-card">
      <div class="bg-app-bar px-6 border-b sticky left-0 flex items-center">
        <h2 class="title my-0 ltr:pr-4 rtl:pl-4 ltr:mr-4 rtl:ml-4 ltr:border-r rtl:border-l hidden sm:block flex-none">
          Productos
        </h2>
        <div class="flex items-center" style="height: 48px;">
          <mat-form-field appearance="outline" class="search-input my-auto">
            <mat-label>Buscar producto</mat-label>
            <input #searchInput matInput [formControl]="searchCtrl" placeholder="Código o nombre" />
            <button mat-icon-button matSuffix *ngIf="searchCtrl.value" aria-label="Limpiar búsqueda" (click)="searchCtrl.setValue('')">
              <mat-icon class="icon-sm" svgIcon="mat:close"></mat-icon>
            </button>
          </mat-form-field>
          <button
          (click)="createProduct(searchCtrl.value)"
          class="ml-4 flex-none"
          color="primary"
          mat-mini-fab
          matTooltip="Agregar producto"
          type="button">
          <mat-icon svgIcon="mat:add" class="icon-sm"></mat-icon>
          <span class="flex-1"></span>
        </button>
        </div>
      </div>
      <div class="px-4 products-panel">
        <div class="products-container" [style.min-height.px]="getMinHeightValue()">
          <div class="products-list" (scroll)="onTableScroll($event)">
      <table class="w-full" mat-table [dataSource]="dataSource" matSort>
        <!-- Barcode Column -->
        <ng-container matColumnDef="id">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Código barras</th>
          <td *matCellDef="let product" mat-cell>{{ product.barcode }}</td>
        </ng-container>
        <!-- Name Column -->
        <ng-container matColumnDef="nombre">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Producto</th>
          <td *matCellDef="let product" mat-cell>{{ product.nombre }}</td>
        </ng-container>
        <!-- Price Column -->
        <ng-container matColumnDef="price">
          <th *matHeaderCellDef mat-header-cell mat-sort-header>Precio</th>
          <td *matCellDef="let product" mat-cell>${{ product.precio | number:'1.2-2' }}</td>
        </ng-container>
        <!-- Edit Column -->
        <ng-container matColumnDef="edit">
          <th *matHeaderCellDef mat-header-cell></th>
          <td *matCellDef="let product" mat-cell class="flex items-center gap-2">
            <button mat-icon-button color="accent" (click)="editProduct(product); $event.stopPropagation()">
              <mat-icon svgIcon="mat:edit"></mat-icon>
            </button>
            <button 
              mat-icon-button 
              [color]="isProductActive(product) ? 'warn' : 'primary'"
              (click)="toggleProductActivation(product); $event.stopPropagation()"
              [matTooltip]="isProductActive(product) ? 'Desactivar producto' : 'Activar producto'">
              <mat-icon svgIcon="mat:{{ isProductActive(product) ? 'block' : 'check_circle' }}"></mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row 
            *matRowDef="let row; columns: displayedColumns"
            (click)="onRowClick(row)"
            [class.inactive-row]="!isProductActive(row)"
            [class.selected-row]="isRowSelected(row)"></tr>
      </table>
            <div class="loading-more" *ngIf="loadingMore">Cargando más productos...</div>
          </div>
        </div>
      </div>
    </div>
  </vex-page-layout-content>
</vex-page-layout>
