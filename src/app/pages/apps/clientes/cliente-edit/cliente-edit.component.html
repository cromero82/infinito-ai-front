<form (ngSubmit)="save()" [formGroup]="form" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <div class="flex items-center dialog-header" mat-dialog-title cdkDragHandle>
    <h2 class="headline m-0 flex-auto">
      {{ form.controls['nombre'].value || (data ? 'Editar cliente' : 'Nuevo cliente') }}
    </h2>
    <button class="text-secondary" mat-dialog-close mat-icon-button type="button">
      <mat-icon svgIcon="mat:close"></mat-icon>
    </button>
  </div>
  <mat-divider class="text-border"></mat-divider>
  <mat-dialog-content class="flex flex-col">
    <mat-form-field class="mt-6 flex-1">
      <mat-label>Nombre</mat-label>
      <input #nombreInput formControlName="nombre" matInput />
      <mat-icon matIconPrefix svgIcon="mat:person"></mat-icon>
    </mat-form-field>
    <mat-form-field class="flex-1">
      <mat-label>Teléfono</mat-label>
      <input #telefonoInput formControlName="telefono" matInput (focus)="onTelefonoFocus()" />
      <mat-icon matIconPrefix svgIcon="mat:phone"></mat-icon>
    </mat-form-field>
    <mat-form-field class="flex-1">
      <mat-label>Documento</mat-label>
      <input #documentoInput formControlName="documento" matInput (focus)="onDocumentoFocus()" />
      <mat-icon matIconPrefix svgIcon="mat:badge"></mat-icon>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button [color]="isEditMode ? 'accent' : 'primary'" mat-flat-button type="submit" [disabled]="form.invalid">
      {{ buttonLabel }}
    </button>
  </mat-dialog-actions>
</form>
