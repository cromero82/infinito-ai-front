<h2 mat-dialog-title>Ajuste de saldo</h2>

<mat-dialog-content class="dialog-content">
  <p class="hint text-secondary">
    Corrige el saldo del origen cuando difiere del valor real (extracto, conteo físico, etc.).
  </p>

  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Origen de fondos</mat-label>
      <mat-select
        formControlName="origenFondosId"
        (selectionChange)="onCuentaChange($event.value)">
        @for (c of data.arbol; track c.id) {
          <mat-option [value]="c.id">{{ c.nombreDisplay }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Saldo en sistema</mat-label>
      <input matInput type="number" step="0.01" formControlName="valorSistema" readonly />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Saldo real</mat-label>
      <input matInput type="number" step="0.01" formControlName="valorReal" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fecha" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Motivo</mat-label>
      <mat-select formControlName="motivoMovimientoId">
        @for (m of motivos; track m.id) {
          <mat-option [value]="m.id">{{ m.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observación</mat-label>
      <textarea matInput rows="2" formControlName="observacion"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="guardando"
    (click)="guardar()">
    {{ guardando ? 'Guardando...' : 'Ajustar' }}
  </button>
</mat-dialog-actions>
