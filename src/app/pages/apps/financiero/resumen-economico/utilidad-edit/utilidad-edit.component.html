<div class="flex items-center dialog-header" mat-dialog-title>
  <h2 class="headline m-0 flex-auto">Estadística — {{ titulo }}</h2>
  <button class="text-secondary" mat-dialog-close mat-icon-button type="button">
    <mat-icon svgIcon="mat:close"></mat-icon>
  </button>
</div>
<mat-divider class="text-border"></mat-divider>
<mat-dialog-content class="flex flex-col gap-4" [formGroup]="form">
  @switch (periodo) {
    @case ("dia") {
      <mat-form-field
        appearance="outline"
        class="w-full"
        subscriptSizing="dynamic">
        <mat-label>Fecha (día)</mat-label>
        <input
          matInput
          [matDatepicker]="pickerDia"
          [formControl]="fechaDiaCtrl" />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerDia"></mat-datepicker-toggle>
        <mat-datepicker #pickerDia></mat-datepicker>
        <mat-hint>Visualización dd/mm/aaaa · envío aaaa-mm-dd</mat-hint>
      </mat-form-field>
    }
    @case ("mes") {
      <app-month-year-picker
        [formControl]="valorMesCtrl"
        label="Mes"
        placeholder="MM/AAAA"
        hint="Visualización mm/aaaa · envío aaaa-mm"></app-month-year-picker>
    }
    @case ("anio") {
      <mat-form-field
        appearance="outline"
        class="w-full"
        subscriptSizing="dynamic">
        <mat-label>Año</mat-label>
        <input
          matInput
          type="number"
          formControlName="valorAnio"
          min="2000"
          max="2100" />
        <mat-hint>Envío: aaaa</mat-hint>
      </mat-form-field>
    }
  }
</mat-dialog-content>
<mat-dialog-actions align="end" class="flex flex-wrap gap-2">
  <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="registrar()"
    [disabled]="!puedeRegistrar()">
    Crear estadística
  </button>
</mat-dialog-actions>
