<h2 mat-dialog-title>Entrada manual</h2>

<mat-dialog-content class="dialog-content">
  <p class="intro">
    Instalación: registre el efectivo inicial de la caja registradora. Este valor
    será la <strong>Base</strong> del primer corte.
  </p>

  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Origen de fondos</mat-label>
      <input
        matInput
        [value]="data.pendiente.cajaEfectivoNombre"
        readonly
        tabindex="-1" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Motivo</mat-label>
      <input
        matInput
        [value]="data.pendiente.motivoMovimientoNombre"
        readonly
        tabindex="-1" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor</mat-label>
      <input matInput type="number" min="0.01" step="0.01" formControlName="valor" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fecha" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Observación</mat-label>
      <textarea matInput rows="2" formControlName="observacion"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="guardando" (click)="cancelar()">
    Cancelar
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="guardando"
    (click)="confirmar()">
    @if (guardando) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Registrar
    }
  </button>
</mat-dialog-actions>
