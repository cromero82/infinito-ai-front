<div class="flex flex-col">
  <div class="flex items-center justify-between p-6">
    <h3 class="headline m-0">{{ isEditMode ? 'Editar Tipo' : 'Crear Nuevo Tipo' }}</h3>
    <button (click)="onCancel()" mat-icon-button type="button">
      <mat-icon svgIcon="mat:close"></mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col p-6">
    <mat-form-field class="w-full">
      <mat-label>Nombre del Tipo</mat-label>
      <input matInput formControlName="name" placeholder="Ingrese el nombre del tipo" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        El nombre es requerido
      </mat-error>
      <mat-error *ngIf="form.get('name')?.hasError('minlength')">
        El nombre debe tener al menos 2 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Porcentaje de Ganancia</mat-label>
      <input matInput type="number" formControlName="percentProfit" placeholder="Ingrese el porcentaje de ganancia" />
      <mat-error *ngIf="form.get('percentProfit')?.hasError('required')">
        El porcentaje de ganancia es requerido
      </mat-error>
      <mat-error *ngIf="form.get('percentProfit')?.hasError('min')">
        El porcentaje debe ser mayor a 0
      </mat-error>
      <mat-error *ngIf="form.get('percentProfit')?.hasError('max')">
        El porcentaje debe ser menor a 100
      </mat-error>
    </mat-form-field>

    <div class="flex justify-end gap-2 mt-6">
      <button (click)="onCancel()" mat-button type="button">
        Cancelar
      </button>
      <button [disabled]="form.invalid" mat-flat-button color="primary" type="submit">
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
