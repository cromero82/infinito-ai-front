<div class="cargue-producto-modal">
  <h2 mat-dialog-title>Registrar Carga de Productos</h2>

  <mat-dialog-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-content">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre del Cargue</mat-label>
          <input 
            matInput 
            formControlName="nombre" 
            placeholder="Ej: Migración Diciembre 2025"
            [disabled]="loading">
          <mat-error *ngIf="form.get('nombre')?.hasError('required')">
            El nombre es requerido
          </mat-error>
          <mat-error *ngIf="form.get('nombre')?.hasError('minlength')">
            El nombre debe tener al menos 3 caracteres
          </mat-error>
        </mat-form-field>

        <div class="file-upload-section">
          <input
            type="file"
            #fileInput
            (change)="onFileSelected($event)"
            accept=".xls,.xlsx,.csv"
            [disabled]="loading"
            style="display: none;">
          
          <div class="file-input-container">
            <button
              type="button"
              mat-stroked-button
              color="primary"
              (click)="fileInput.click()"
              [disabled]="loading">
              <mat-icon svgIcon="mat:attach_file"></mat-icon>
              <span>Seleccionar Archivo</span>
            </button>
            
            <div class="file-info" *ngIf="selectedFileName">
              <span class="file-name">{{ selectedFileName }}</span>
              <button
                type="button"
                mat-icon-button
                color="warn"
                (click)="removeFile()"
                [disabled]="loading"
                matTooltip="Eliminar archivo">
                <mat-icon svgIcon="mat:close"></mat-icon>
              </button>
            </div>
          </div>

          <div class="file-hint">
            Formatos permitidos: Excel (.xls, .xlsx) o CSV (.csv)
          </div>
        </div>

        <div class="error-message" *ngIf="error">
          {{ error }}
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      (click)="onCancel()"
      [disabled]="loading">
      Cancelar
    </button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="onSubmit()"
      [disabled]="form.invalid || loading">
      <mat-spinner *ngIf="loading" diameter="20" class="spinner-inline"></mat-spinner>
      <span *ngIf="!loading">Registrar</span>
      <span *ngIf="loading">Registrando...</span>
    </button>
  </mat-dialog-actions>
</div>
